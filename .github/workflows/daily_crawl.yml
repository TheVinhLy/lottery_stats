name: Daily Lottery Crawl

on:
  # Chạy tự động mỗi ngày lúc 18:30 giờ Việt Nam (11:30 UTC)
  schedule:
    - cron: "30 11 * * *"

  # Cho phép chạy thủ công từ GitHub Actions UI
  workflow_dispatch:
    inputs:
      date:
        description: "Ngày crawl (YYYY-MM-DD), bỏ trống = hôm qua"
        required: false
        default: ""
      days:
        description: "Số ngày crawl (mặc định 1)"
        required: false
        default: "1"

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install requests beautifulsoup4 lxml psycopg2-binary python-dotenv

      - name: Run crawler
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            python crawl_daily.py --date "${{ github.event.inputs.date }}" --days "${{ github.event.inputs.days || '1' }}"
          else
            python crawl_daily.py --days "${{ github.event.inputs.days || '1' }}"
          fi
