name: Keep Workflows Alive

on:
  schedule:
    # Chạy ngày 1 mỗi tháng lúc 0:00 UTC
    - cron: "0 0 1 * *"
    # Ping Streamlit app mỗi 6 giờ để không bị ngủ
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Keep workflows alive
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git commit --allow-empty -m "chore: keepalive [skip ci]"
          git push

  ping-streamlit:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit app to prevent sleep
        run: |
          curl -s -o /dev/null -w "HTTP %{http_code}" https://thongkexs.streamlit.app/ || true
