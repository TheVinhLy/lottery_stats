name: Keep Workflows Alive

on:
  schedule:
    # Chạy ngày 1 mỗi tháng lúc 0:00 UTC
    - cron: "0 0 1 * *"
    # Ping Streamlit app mỗi 6 giờ để không bị ngủ
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Keep workflows alive
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git commit --allow-empty -m "chore: keepalive [skip ci]"
          git push

  ping-streamlit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Playwright
        run: |
          pip install playwright
          playwright install chromium --with-deps
      - name: Wake up Streamlit app
        run: |
          python - <<'EOF'
          import asyncio
          from playwright.async_api import async_playwright

          async def main():
              async with async_playwright() as p:
                  browser = await p.chromium.launch()
                  page = await browser.new_page()
                  try:
                      await page.goto('https://thongkexs.streamlit.app/', timeout=60000)
                      await page.wait_for_timeout(3000)
                      btn = page.get_by_text('Yes, get this app back up!')
                      if await btn.is_visible():
                          await btn.click()
                          print('Clicked wake up button - app is waking up')
                          await page.wait_for_timeout(20000)
                      else:
                          print('App is already running')
                  finally:
                      await browser.close()

          asyncio.run(main())
          EOF
